[package]
name = "firmament"
version = "0.1.0"
edition = "2024"

[features]
aws = ["dep:aws-config"]
email = ["aws", "dep:aws-sdk-ses"]
postgres = ["dep:tokio-postgres"]
web = ["dep:axum"]

[dependencies]
anyhow = "1"
aws-config = { version = "1", features = ["credentials-login"], optional = true }
aws-sdk-ses = { version = "1", optional = true }
axum = { version = "0.8.9", optional = true, features = ["ws"] }
base32 = { version = "0.5.1" }
bytes = "1.12.1"
dotenv = "0.15"
env_logger = "0.11.11"
firmament_proc_macros = { path = "../firmament-proc-macros" }
futures-util = "0.3.34"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = { version = "0.7.18", optional = true, features = ["with-serde_json-1"] }
tokio-tungstenite = "0.30.0"
toml = "1"
tower-http = { version = "0.7.1", features = ["fs"] }
